<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>51 причина почему я тебя люблю 🤍</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: linear-gradient(180deg, #FFE5EC 0%, #E8DBFC 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden; position: relative;
        }
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.04; pointer-events: none; z-index: 10;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://w3.org id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        .phone-container {
            width: 100vw; height: 100vh;
            max-width: 393px; max-height: 852px;
            position: relative; overflow: hidden;
        }
        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .slide.active {
            opacity: 1; visibility: visible;
        }
        .slide img, .slide video {
            width: 100%; height: 100%; object-fit: contain;
        }
        .start-btn {
            position: absolute; bottom: 12%; left: 50%;
            transform: translateX(-50%);
            background: none; border: none; cursor: pointer;
            z-index: 5; display: flex; flex-direction: column; align-items: center;
        }
        .nav-btn {
            position: absolute; bottom: 5%; width: 60px; height: 60px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%; cursor: pointer; z-index: 5;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; color: #2D1B36; box-shadow: 0 4px 12px rgba(45,27,54,0.05);
        }
        .nav-btn:active { transform: scale(0.95); }
        .prev-btn { left: 30px; }
        .next-btn { right: 30px; }
    </style>
</head>
<body>

    <audio id="bg-music" loop></audio>

    <div class="phone-container">
        <!-- ОБЛОЖКА (Слайд 0) -->
        <div class="slide active" id="slide-0">
            <img src="0.png" alt="Обложка">
            <div class="start-btn" onclick="startExperience()">
                <div style="width: 160px; height: 160px;"></div>
            </div>
        </div>

        <div id="dynamic-slides"></div>
    </div>

    <script {nonce}>
        // НАШ ИСПРАВЛЕННЫЙ ПОРЯДОК КАРТИНОК ИЗ ТВОЕГО СПИСКА
        // Сюда автоматически подставятся нужные имена файлов, чтобы восстановить структуру
        const order = [
            4,   // Вместо 3 покажет 4
            5,   // Вместо 4 покажет 5
            6,   // Вместо 5 покажет 6
            7,   // Вместо 6 покажет 7
            8,   // Вместо 7 покажет 8
            9,   // Вместо 8 покажет 9
            10,  // Вместо 9 покажет 10
            12,  // Вместо 11 покажет 12
            11,  // Вместо 12 покажет 11
            3,   // Вместо 13 покажет ту самую потерявшуюся 3
            13,  // Вместо 14 покажет 13
            14,  // Вместо 15 покажет 14
            15,  // Вместо 16 покажет 15
            16,  // Вместо 17 покажет 16
            17,  // Вместо 18 покажет 17
            19,  // Вместо 19 покажет 18 (по твоей логике сдвига)
            18,  // Вместо 20 покажет 19
            20,  // Вместо 21 покажет 20
            21,  // Предпоследняя 21
            22   // Твой красивый финал «Потому что ты — это ты»
        ];

        let currentSlide = 0;
        const music = document.getElementById('bg-music');
        const container = document.getElementById('dynamic-slides');

        // Генерируем слайды по нашему хитрому массиву порядка
        for (let i = 0; i < order.length; i++) {
            const slide = document.createElement('div');
            slide.className = 'slide';
            slide.id = `slide-${i + 1}`; // ID слайдов пойдут по порядку: 1, 2, 3...
            
            slide.innerHTML = `
                <img src="${order[i]}.png" alt="Причина">
                <button class="nav-btn prev-btn" onclick="changeSlide(-1)">←</button>
                <button class="nav-btn next-btn" onclick="changeSlide(1)">→</button>
                `;
            container.appendChild(slide);
        }

        // Самый последний слайд — твое живое видео
        const videoSlide = document.createElement('div');
        videoSlide.className = 'slide';
        videoSlide.id = `slide-${order.length + 1}`;
        videoSlide.innerHTML = `
            <video src="final_video.mp4" autoplay loop muted playsinline></video>
            <button class="nav-btn prev-btn" onclick="changeSlide(-1)">←</button>
        `;
        container.appendChild(videoSlide);

        // Общее число слайдов (Обложка + массив картинок + 1 видео)
        const totalSlides = 1 + order.length + 1;

        function startExperience() {
            if (!music.src) {
                music.src = "music.mp3";
                music.load();
            }
            music.play()
                .then(() => { changeSlide(1); })
                .catch(e => { changeSlide(1); });
        }

        function changeSlide(direction) {
            const oldSlide = document.getElementById(`slide-${currentSlide}`);
            if (oldSlide) oldSlide.classList.remove('active');
            
            currentSlide += direction;
            
            const newSlide = document.getElementById(`slide-${currentSlide}`);
            if (newSlide) newSlide.classList.add('active');

            if (currentSlide > 0 && music.paused) {
                music.play().catch(o => console.log(o));
            }
        }
    </script>
</body>
</html>
